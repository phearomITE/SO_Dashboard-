services:
  so-bot:
    build: .
    command: ["python", "-m", "app.main"]
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: host.docker.internal
      TESSERACT_CMD: tesseract
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
