services:
  - type: web
    name: so-alert-dashboard-bot
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: DASHBOARD_ADMIN_TOKEN
        generateValue: true
      - key: DASHBOARD_COOKIE_SECURE
        value: "true"
      - key: DASHBOARD_ADMIN_EMAILS
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURITY
        value: starttls
      - key: SMTP_FROM
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_WEBHOOK_URL
        sync: false
      - key: EMAIL_WEBHOOK_SECRET
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: APP_TIMEZONE
        value: Asia/Phnom_Penh
      - key: TESSERACT_CMD
        value: tesseract
      - key: RUN_BOT_IN_WEB
        value: "true"
      - key: TEST_MODE
        value: "false"
