services:
  dashboard:
    build: .
    restart: unless-stopped
    expose:
      - "4173"
    command: npm run preview -- --host 0.0.0.0 --port 4173

  ngrok:
    image: ngrok/ngrok:latest
    restart: unless-stopped
    depends_on:
      - dashboard
    command:
      - "http"
      - "--basic-auth=${NGROK_BASIC_AUTH:?Set NGROK_BASIC_AUTH in .env.ngrok}"
      - "dashboard:4173"
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:?Set NGROK_AUTHTOKEN in .env.ngrok}
    ports:
      - "127.0.0.1:${NGROK_INSPECTOR_PORT:-4040}:4040"
